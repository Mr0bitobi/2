name: validate-kit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate example evaluation cases
        run: python scripts/validate_jsonl.py examples/evaluation_cases.jsonl
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
